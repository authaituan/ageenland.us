# /etc/nginx/sites-available/greenland  →  ln -s ../sites-available/greenland /etc/nginx/sites-enabled/
# Thay example.com bằng tên miền thật. Sau đó: sudo nginx -t && sudo systemctl reload nginx
# HTTPS miễn phí: sudo certbot --nginx -d example.com -d www.example.com
server {
    listen 80;
    server_name example.com www.example.com;

    client_max_body_size 6m;   # ảnh upload tối đa 5 MB

    location / {
        proxy_pass http://127.0.0.1:5454;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
